# render.yaml
# Purpose: Render Blueprint for the hosted PhishGuard API and browser UI.
# Author: Colile Sibanda

services:
  - type: web
    name: phishguard
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render puts its own proxies in front; trust exactly those for client addresses.
      - key: PHISHGUARD_PROXY_HOPS
        value: "3"
